<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ByteBuddy Vocab Hub — Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body
    data-page="table"
    data-nav-prefix=""
    data-asset-prefix=""
    data-browse-href="../index.html"
  >
    <div class="blob blob-a" aria-hidden="true"></div>
    <div class="blob blob-b" aria-hidden="true"></div>

    <header class="site-header">
      <div class="brand">
        <span class="mascot-static" aria-hidden="true">📋</span>
        <div>
          <p class="eyebrow">Database structure</p>
          <h1>Table view</h1>
        </div>
      </div>
      <nav class="site-nav" aria-label="Main"></nav>
    </header>

    <main class="layout layout-table">
      <section class="panel filters-panel float-in">
        <h2 class="panel-title">Filter rows</h2>
        <label class="field">
          <span class="field-label">Search</span>
          <input id="search" type="search" placeholder="Search all columns…" />
        </label>
        <div class="field-row">
          <label class="field">
            <span class="field-label">Module</span>
            <select id="filter-module">
              <option value="">All modules</option>
              <option value="Programming">Programming</option>
              <option value="AI &amp; ML">AI &amp; ML</option>
              <option value="Maths &amp; Logic">Maths &amp; Logic</option>
              <option value="Lab &amp; Tools">Lab &amp; Tools</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Review status</span>
            <select id="filter-review">
              <option value="">Any status</option>
              <option value="New">New</option>
              <option value="Learning">Learning</option>
              <option value="Mastered">Mastered</option>
            </select>
          </label>
        </div>
        <label class="field">
          <span class="field-label">Sort</span>
          <select id="filter-sort">
            <option value="word-asc">Word (A → Z)</option>
            <option value="module-asc">Module, then word</option>
            <option value="date-desc">Word length</option>
            <option value="status-group">Review status</option>
          </select>
        </label>
        <button type="button" id="btn-export-csv" class="btn-primary">Export CSV 📥</button>
        <button type="button" id="btn-clear-filters" class="btn-secondary">Clear filters ✨</button>
        <p id="table-count" class="result-stats"></p>
        <p class="hint">Click column headers <strong>Word</strong> or <strong>Module</strong> to sort quickly.</p>
      </section>

      <section class="table-wrap panel float-in delay-1">
        <div class="table-scroll">
          <table class="vocab-table">
            <thead>
              <tr>
                <th class="sortable" data-sort-key="word">Word ↕</th>
                <th class="sortable" data-sort-key="module">Module ↕</th>
                <th>POS</th>
                <th>Phonetic</th>
                <th>ZH meaning 中文</th>
                <th>EN definition</th>
                <th>Example</th>
                <th>Review</th>
              </tr>
            </thead>
            <tbody id="vocab-tbody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Read-only table · <span data-db-version></span> · evidence screenshots</p>
    </footer>

    <script src="js/vocab-extra.js"></script>
    <script src="js/words.js"></script>
    <script src="js/review-storage.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/export-sort.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/table.js"></script>
  </body>
</html>
