<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ByteBuddy Vocab Hub — References</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="refs">
    <div class="blob blob-a" aria-hidden="true"></div>
    <div class="blob blob-b" aria-hidden="true"></div>

    <header class="site-header">
      <div class="brand">
        <span class="mascot-static" aria-hidden="true">📚</span>
        <div>
          <p class="eyebrow">Academic integrity</p>
          <h1>References (APA)</h1>
        </div>
      </div>
      <nav class="site-nav" aria-label="Main"></nav>
    </header>

    <main class="refs-layout">
      <section class="panel float-in">
        <p id="ref-count" class="result-stats"></p>
        <p class="hint">
          Primary source for each entry is stored in the <code>source_apa</code> field.
          Copy this list into your 1000-word reflection or portfolio References section.
        </p>
        <ol id="references-list" class="references-list"></ol>
      </section>
    </main>

    <footer class="site-footer">
      <p>References · <span data-db-version></span></p>
    </footer>

    <script src="js/vocab-extra.js"></script>
    <script src="js/words.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/references.js"></script>
  </body>
</html>
